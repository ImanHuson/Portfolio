name: Deploy Pages

# Once this workflow exists, the repo's Pages "Source" setting must be
# switched (Settings → Pages) from "Deploy from a branch" to "GitHub
# Actions" — the two are mutually exclusive for a single Pages site.
# This workflow serves the WHOLE site: the root landing page, the main
# portfolio, and all four built apps get assembled into one artifact.

on:
  push:
    branches: [main]
    # Skill, agent and instruction-file changes don't touch the site, so
    # they don't need a rebuild. Any push that also changes a site file
    # still deploys.
    paths-ignore:
      - ".claude/**"
      - "CLAUDE.md"
      - "**/AGENTS.md"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            book-site-react/package-lock.json
            red-rising-archive/package-lock.json
            the-rising-archive/package-lock.json
            attack-on-titan-archive/package-lock.json

      - name: Build book-site-react
        working-directory: book-site-react
        run: |
          npm ci
          npm run build

      - name: Build red-rising-archive
        working-directory: red-rising-archive
        run: |
          npm ci
          npm run build

      - name: Build the-rising-archive
        working-directory: the-rising-archive
        run: |
          npm ci
          npm run build

      - name: Build attack-on-titan-archive
        working-directory: attack-on-titan-archive
        run: |
          npm ci
          npm run build

      - name: Assemble Pages artifact
        run: |
          mkdir -p _site
          cp index.html _site/
          cp Iman_Kasim_Portfolio.html _site/
          mkdir -p _site/book-site-react
          cp -r book-site-react/dist/. _site/book-site-react/
          mkdir -p _site/red-rising-archive
          cp -r red-rising-archive/dist/. _site/red-rising-archive/
          mkdir -p _site/the-rising-archive
          cp -r the-rising-archive/out/. _site/the-rising-archive/
          mkdir -p _site/attack-on-titan-archive
          cp -r attack-on-titan-archive/out/. _site/attack-on-titan-archive/

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
