<!doctype html>
<!--
  Offline renderer for the Nine Titans (turntables + x-ray plates).
  Opened by scripts/titans/render.mjs in headless Chromium; not part of the site.

  Each Titan is a raymarched signed-distance body: a shared anatomical
  humanoid (ribcage, pecs, lats, deltoids, biceps, calves, knees, hands with
  thumbs, a real crouch) plus the features that identify it in the show,
  built as generic forms, not copies of any design. Every surface carries a
  material (skin, flayed muscle, hardened plate, crystal, hair, fur, bone,
  iron) with its own albedo, relief and sheen; lighting has soft self-shadows,
  AO, a warm key, a hard rim and backlit translucency.

  uMode 0: lit turntable frame. uMode 1: x-ray (body density plus skeleton).
-->
<meta charset="utf-8" />
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<canvas id="c" width="300" height="600"></canvas>
<script>
const FS = `#version 300 es
precision highp float;
uniform vec2 uRes;
uniform float uAngle;
uniform int uForm;
uniform int uMode;
out vec4 outColor;

// ---------------------------------------------------------------- utilities
float hash3(vec3 p){p=fract(p*0.3183099+0.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float noise3(vec3 x){vec3 i=floor(x);vec3 f=fract(x);f=f*f*(3.0-2.0*f);
 return mix(mix(mix(hash3(i),hash3(i+vec3(1,0,0)),f.x),mix(hash3(i+vec3(0,1,0)),hash3(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(hash3(i+vec3(0,0,1)),hash3(i+vec3(1,0,1)),f.x),mix(hash3(i+vec3(0,1,1)),hash3(i+vec3(1,1,1)),f.x),f.y),f.z);}
float fbm3(vec3 p){float v=0.0,a=0.5;for(int i=0;i<4;i++){v+=a*noise3(p);p=p*2.03+vec3(1.7,9.2,3.1);a*=0.5;}return v;}
float smin(float a,float b,float k){float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0);return mix(b,a,h)-k*h*(1.0-h);}
float smax(float a,float b,float k){return -smin(-a,-b,k);}
float sdCap(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0);return length(pa-ba*h)-r;}
float sdCone(vec3 p,vec3 a,vec3 b,float ra,float rb){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0);return length(pa-ba*h)-mix(ra,rb,h);}
float sdEll(vec3 p,vec3 r){float k0=length(p/r);float k1=length(p/(r*r));return k0*(k0-1.0)/k1;}
float sdBox(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0);}
vec3 rotX(vec3 p,float a){float c=cos(a),s=sin(a);return vec3(p.x,c*p.y-s*p.z,s*p.y+c*p.z);}

// material ids
const float SKIN=0.0, MUSCLE=1.0, PLATE=2.0, CRYSTAL=3.0, HAIR=4.0, FUR=5.0, BONE=6.0, IRON=7.0, BLOND=8.0;
vec2 U(vec2 a,vec2 b){return a.x<b.x?a:b;}
vec2 S(vec2 a,vec2 b,float k){float d=smin(a.x,b.x,k);return vec2(d,a.x<b.x?a.y:b.y);}

// ------------------------------------------------------------ the anatomy
struct B { float sw; float hw; float m; float leg; float tor; float hr; float arm; float spread; float hunch; float crouch; };
// joints written by humanoid() for the per-Titan features
vec3 jHead; vec3 jHandL; vec3 jHandR; vec3 jChest; float jShY; float jHipY;

float humanoid(vec3 p, B b) {
  float hipY=b.leg*(1.0-0.42*b.crouch);
  jHipY=hipY;
  vec3 q=vec3(abs(p.x),p.y,p.z);
  // legs: thigh taper, knee, calf, foot; a crouch pushes the knee forward and up
  vec3 hip=vec3(b.hw,hipY,0.0);
  vec3 knee=vec3(b.hw*1.08,hipY*0.52+b.crouch*0.55,0.12+b.crouch*0.95);
  vec3 ank=vec3(b.hw*1.14,0.22,-0.04-b.crouch*0.15);
  vec3 midT=mix(hip,knee,0.45);
  float d=sdCone(q,hip,knee,0.29*b.m,0.19*b.m);
  d=smin(d,sdEll(q-midT-vec3(0.0,0.0,0.07),vec3(0.2,0.42,0.2)*b.m),0.1);                // quadriceps
  d=smin(d,sdEll(q-knee-vec3(0.0,0.0,0.08),vec3(0.14,0.13,0.12)*b.m),0.06);              // kneecap
  d=smin(d,sdCone(q,knee,ank,0.18*b.m,0.11*b.m),0.07);
  d=smin(d,sdEll(q-mix(knee,ank,0.3)-vec3(0.0,0.0,-0.09),vec3(0.14,0.32,0.15)*b.m),0.07); // calf
  d=smin(d,sdEll(q-vec3(b.hw*1.16,0.09,0.13),vec3(0.14,0.09,0.3)*b.m),0.06);              // foot
  d=smin(d,sdEll(p-vec3(0.0,hipY+0.05,-0.02),vec3(b.hw*1.55,0.32,0.33)*vec3(1.0,1.0,b.m)),0.13); // pelvis
  d=smin(d,sdEll(q-vec3(b.hw*0.7,hipY-0.12,-0.2),vec3(0.26,0.26,0.2)*b.m),0.1);          // glutes

  // the upper body leans around the hips
  vec3 u=rotX(p-vec3(0.0,hipY,0.0),-b.hunch)+vec3(0.0,hipY,0.0);
  vec3 uq=vec3(abs(u.x),u.y,u.z);
  float shY=hipY+b.tor; jShY=shY;
  jChest=vec3(0.0,hipY+b.tor*0.72,0.3);
  float t=sdCap(u,vec3(0.0,hipY+0.12,0.0),vec3(0.0,hipY+b.tor*0.5,0.02),0.3*b.m);          // abdomen
  t=smin(t,sdEll(u-vec3(0.0,hipY+b.tor*0.72,0.0),vec3(b.sw*0.8,b.tor*0.33,0.38*b.m)),0.18); // ribcage
  t=smin(t,sdEll(uq-vec3(b.sw*0.38,hipY+b.tor*0.84,0.2),vec3(0.3,0.2,0.16)*b.m),0.09);     // pectorals
  t=smin(t,sdEll(uq-vec3(b.sw*0.62,hipY+b.tor*0.62,-0.06),vec3(0.2,0.44,0.22)*b.m),0.12);  // lats
  t=smin(t,sdEll(uq-vec3(b.sw*0.3,hipY+b.tor*0.3,0.14),vec3(0.2,0.3,0.14)*b.m),0.1);       // obliques
  t=smin(t,sdCap(uq,vec3(b.sw*0.72,shY+0.02,-0.06),vec3(0.0,shY+0.32,-0.06),0.15*b.m),0.12); // trapezius
  t=smin(t,sdEll(uq-vec3(b.sw,shY-0.05,0.0),vec3(0.27,0.27,0.28)*b.m),0.11);               // deltoids
  t=smin(t,sdCap(u,vec3(0.0,shY-0.1,0.0),vec3(0.0,shY+0.36,0.07),0.16*b.m),0.1);           // neck
  // arms: shoulder, elbow, wrist, then a hand with a thumb
  vec3 sh=vec3(b.sw+0.1,shY-0.14,0.0);
  vec3 el=sh+vec3(sin(b.spread)*0.95*b.arm,-0.95*b.arm,0.06);
  vec3 wr=el+vec3(sin(b.spread)*0.85*b.arm,-0.88*b.arm,0.16);
  t=smin(t,sdCone(uq,sh,el,0.2*b.m,0.15*b.m),0.08);
  t=smin(t,sdEll(uq-mix(sh,el,0.5)-vec3(0.0,0.0,0.07),vec3(0.15,0.3,0.15)*b.m),0.07);      // biceps
  t=smin(t,sdEll(uq-mix(sh,el,0.45)-vec3(0.0,0.0,-0.08),vec3(0.15,0.32,0.15)*b.m),0.07);   // triceps
  t=smin(t,sdCone(uq,el,wr,0.17*b.m,0.11*b.m),0.07);
  t=smin(t,sdEll(uq-mix(el,wr,0.28),vec3(0.16,0.28,0.16)*b.m),0.07);                       // forearm
  vec3 hd=wr+vec3(0.02,-0.2*b.arm,0.03);
  t=smin(t,sdEll(uq-hd,vec3(0.08,0.2,0.13)*mix(1.0,b.m,0.5)),0.05);                         // hand
  t=smin(t,sdCap(uq,wr+vec3(-0.02,-0.08,0.1),hd+vec3(-0.05,-0.02,0.16),0.045*b.m),0.03);   // thumb
  jHandR=vec3(-hd.x,hd.y,hd.z); jHandL=hd;
  // head: cranium, jaw, brow, nose, ears; sockets carved
  vec3 hc=vec3(0.0,shY+0.36+b.hr*0.9,0.06); jHead=hc;
  float h=sdEll(u-hc,vec3(b.hr*0.84,b.hr,b.hr*0.96));
  h=smin(h,sdEll(u-hc-vec3(0.0,-b.hr*0.56,b.hr*0.3),vec3(b.hr*0.66,b.hr*0.46,b.hr*0.66)),0.08);
  h=smin(h,sdEll(u-hc-vec3(0.0,b.hr*0.18,b.hr*0.72),vec3(b.hr*0.74,b.hr*0.16,b.hr*0.34)),0.05);
  h=smin(h,sdEll(u-hc-vec3(0.0,-b.hr*0.1,b.hr*0.95),vec3(b.hr*0.14,b.hr*0.26,b.hr*0.16)),0.04);
  h=smin(h,sdEll(uq-hc-vec3(b.hr*0.86,-b.hr*0.02,0.0),vec3(b.hr*0.1,b.hr*0.22,b.hr*0.14)),0.03);
  h=smax(h,-sdEll(uq-hc-vec3(b.hr*0.34,b.hr*0.02,b.hr*0.86),vec3(b.hr*0.22,b.hr*0.14,b.hr*0.2)),0.03);
  t=smin(t,h,0.08);
  return smin(d,t,0.15);
}
// the same joints, as bones: for the x-ray and the Founding Titan
float bones(vec3 p, B b) {
  float hipY=b.leg*(1.0-0.42*b.crouch);
  vec3 q=vec3(abs(p.x),p.y,p.z);
  vec3 hip=vec3(b.hw,hipY,0.0), knee=vec3(b.hw*1.08,hipY*0.52+b.crouch*0.55,0.12+b.crouch*0.95), ank=vec3(b.hw*1.14,0.22,-0.04-b.crouch*0.15);
  float d=sdCap(q,hip,knee,0.075);
  d=min(d,sdCap(q,knee,ank,0.06));
  d=min(d,sdEll(q-vec3(b.hw*1.16,0.08,0.13),vec3(0.1,0.06,0.25)));
  d=min(d,smax(abs(sdEll(p-vec3(0.0,hipY,0.0),vec3(b.hw*1.3,0.26,0.28)))-0.04,p.y-hipY-0.1,0.02));
  vec3 u=rotX(p-vec3(0.0,hipY,0.0),-b.hunch)+vec3(0.0,hipY,0.0);
  vec3 uq=vec3(abs(u.x),u.y,u.z);
  float shY=hipY+b.tor;
  d=min(d,sdCap(u,vec3(0.0,hipY,-0.2),vec3(0.0,shY+0.3,-0.1),0.055+0.015*sin(u.y*60.0)));
  for(int i=0;i<9;i++){float fi=float(i);float ax=b.sw*0.7-abs(fi-3.5)*0.028;float az=0.34-abs(fi-3.5)*0.012;
    float y=hipY+b.tor*0.95-fi*b.tor*0.075-0.16*(u.z/az);vec2 e=vec2(u.x/ax,(u.z+0.02)/az);float r=(length(e)-1.0)*min(ax,az);
    float rib=length(vec2(r,(u.y-y)*1.3))-0.026;rib=max(rib,0.1-length(vec2(u.x*3.0,max(u.z-0.2,0.0))));d=min(d,rib);}
  d=min(d,sdCap(uq,vec3(0.05,shY,0.24),vec3(b.sw*0.9,shY+0.04,0.02),0.04));
  vec3 sh=vec3(b.sw+0.1,shY-0.14,0.0);
  vec3 el=sh+vec3(sin(b.spread)*0.95*b.arm,-0.95*b.arm,0.06);
  vec3 wr=el+vec3(sin(b.spread)*0.85*b.arm,-0.88*b.arm,0.16);
  d=min(d,sdCap(uq,sh,el,0.06));
  d=min(d,sdCap(uq,el,wr,0.045));
  vec3 hc=vec3(0.0,shY+0.36+b.hr*0.9,0.06);
  float sk=abs(sdEll(u-hc,vec3(b.hr*0.8,b.hr*0.92,b.hr*0.9)))-0.02;
  sk=min(sk,abs(sdEll(u-hc-vec3(0.0,-b.hr*0.56,b.hr*0.3),vec3(b.hr*0.6,b.hr*0.4,b.hr*0.6)))-0.02);
  return min(d,sk);
}

// ------------------------------------------------------------ the Nine
B formB(int f){
  if(f==0) return B(0.72,0.3,1.0,3.0,1.75,0.3,1.0,0.12,0.03,0.0);   // Founding (bones)
  if(f==1) return B(0.74,0.3,1.02,3.05,1.72,0.3,1.0,0.14,0.06,0.0);  // Attack
  if(f==2) return B(0.76,0.3,0.92,3.0,1.85,0.33,1.02,0.08,0.04,0.0); // Colossal
  if(f==3) return B(0.92,0.36,1.22,2.9,1.75,0.31,0.98,0.22,0.03,0.0);// Armored
  if(f==4) return B(0.6,0.34,0.84,3.3,1.66,0.27,1.0,0.1,0.02,0.0);   // Female
  if(f==5) return B(1.02,0.33,1.25,2.35,1.85,0.25,1.55,0.2,0.34,0.0);// Beast
  if(f==6) return B(0.64,0.3,0.95,2.9,1.62,0.3,1.25,0.25,0.72,0.8); // Jaw
  return B(0.62,0.3,0.86,3.25,1.68,0.26,1.0,0.1,0.02,0.0);           // War Hammer
}

vec2 attackT(vec3 p){
  B b=formB(1); vec2 d=vec2(humanoid(p,b),SKIN);
  vec3 u=rotX(p-vec3(0.0,jHipY,0.0),-b.hunch)+vec3(0.0,jHipY,0.0);
  // long hair: strands falling from the crown past the jaw to the shoulders
  float hair=sdEll(u-jHead-vec3(0.0,0.1,-0.06),vec3(0.36,0.32,0.36));
  for(int i=0;i<7;i++){float a=(float(i)/6.0-0.5)*3.4; vec3 top=jHead+vec3(sin(a)*0.26,0.14,cos(a)*0.2-0.08);
    vec3 bot=top+vec3(sin(a)*0.14,-0.62-0.12*noise3(vec3(float(i))),-0.08);
    hair=smin(hair,sdCap(u,top,bot,0.07-0.02*float(i%2)),0.06);}
  hair+=0.02*(noise3(u*vec3(28.0,3.0,28.0))-0.5);
  hair=smax(hair,-(sdEll(u-jHead-vec3(0.0,-0.08,0.2),vec3(0.26,0.3,0.24))),0.04);   // keep the face clear
  return U(d,vec2(hair,HAIR));
}
vec2 colossalT(vec3 p){
  B b=formB(2); vec2 d=vec2(humanoid(p,b),MUSCLE);
  vec3 u=rotX(p-vec3(0.0,jHipY,0.0),-b.hunch)+vec3(0.0,jHipY,0.0);
  vec3 c=u-jHead-vec3(0.0,-0.18,-0.02);                 // the grin: teeth from cheek to cheek
  float a=atan(c.x,c.z);float rr=length(c.xz);
  float teeth=max((length(vec2((rr-0.25)/0.028,c.y/0.06))-1.0)*0.028,(abs(a)-1.05)*rr);
  d.x=smax(d.x,-max((length(vec2((rr-0.28)/0.08,c.y/0.075))-1.0)*0.075,(abs(a)-1.12)*rr),0.015);
  d.x+=0.013*sin(p.y*30.0)*smoothstep(0.35,0.55,abs(p.x))*(1.0-smoothstep(0.58,0.66,abs(p.x)))*step(3.9,p.y)*step(p.y,4.7);
  return U(d,vec2(teeth,BONE));
}
vec2 armoredT(vec3 p){
  B b=formB(3); vec2 d=vec2(humanoid(p,b),MUSCLE);
  vec3 u=rotX(p-vec3(0.0,jHipY,0.0),-b.hunch)+vec3(0.0,jHipY,0.0);
  vec3 uq=vec3(abs(u.x),u.y,u.z); vec3 q=vec3(abs(p.x),p.y,p.z);
  float hipY=jHipY, tor=b.tor, shY=jShY;
  // plates: a breastplate, segmented abdomen, pauldrons, bracers, thigh and shin guards, a face plate
  float pl=smax(sdEll(u-vec3(0.0,hipY+tor*0.74,0.06),vec3(b.sw*0.86,tor*0.3,0.44)),-(u.z+0.05),0.05);
  for(int i=0;i<3;i++){float y=hipY+0.22+float(i)*0.2; pl=min(pl,smax(sdEll(u-vec3(0.0,y,0.2),vec3(0.3,0.1,0.2)),-(u.z-0.05),0.03));}
  pl=min(pl,smax(sdEll(uq-vec3(b.sw+0.04,shY+0.02,0.0),vec3(0.36,0.3,0.36)),-(uq.y-shY+0.12),0.04));
  vec3 sh=vec3(b.sw+0.1,shY-0.14,0.0); vec3 el=sh+vec3(sin(b.spread)*0.95*b.arm,-0.95*b.arm,0.06); vec3 wr=el+vec3(sin(b.spread)*0.85*b.arm,-0.88*b.arm,0.16);
  pl=min(pl,sdCone(uq,mix(el,wr,0.15),mix(el,wr,0.85),0.24,0.17));
  vec3 hip=vec3(b.hw,hipY,0.0), knee=vec3(b.hw*1.08,hipY*0.52,0.12), ank=vec3(b.hw*1.14,0.22,-0.04);
  pl=min(pl,smax(sdCone(q,mix(hip,knee,0.15),mix(hip,knee,0.8),0.34,0.25),-(q.z+0.02),0.03));
  pl=min(pl,smax(sdCone(q,mix(knee,ank,0.08),mix(knee,ank,0.8),0.22,0.15),-(q.z+0.0),0.03));
  float face=smax(sdEll(u-jHead-vec3(0.0,0.0,0.06),vec3(0.3,0.36,0.34)),-(u.z-jHead.z+0.02),0.04);
  face=smax(face,-sdBox(uq-jHead-vec3(0.11,0.04,0.3),vec3(0.07,0.025,0.2)),0.01);          // eye slits
  pl=min(pl,face);
  pl-=0.012*smoothstep(0.55,0.75,fbm3(p*7.0));
  return U(d,vec2(pl,PLATE));
}
vec2 femaleT(vec3 p){
  B b=formB(4); vec2 d=vec2(humanoid(p,b),SKIN);
  vec3 u=rotX(p-vec3(0.0,jHipY,0.0),-b.hunch)+vec3(0.0,jHipY,0.0);
  float hair=smax(sdEll(u-jHead-vec3(0.0,0.07,-0.03),vec3(0.3,0.27,0.31)),-(sdEll(u-jHead-vec3(0.0,-0.05,0.18),vec3(0.24,0.26,0.24))),0.03);
  hair=min(hair,sdEll(u-jHead-vec3(0.0,0.02,-0.3),vec3(0.13,0.15,0.12)));                   // the tied-back knot
  hair+=0.015*(noise3(u*vec3(30.0,4.0,30.0))-0.5);
  // hardened crystal over both fists
  vec3 uq=vec3(abs(u.x),u.y,u.z);
  float cr=sdEll(uq-jHandL-vec3(0.0,-0.02,0.0),vec3(0.14,0.22,0.17))-0.01*noise3(p*18.0);
  return U(U(d,vec2(hair,BLOND)),vec2(cr,CRYSTAL));
}
vec2 beastT(vec3 p){
  B b=formB(5); float body=humanoid(p,b);
  // fur: long, shaggy, heavier on the shoulders and forearms
  float shag=0.05+0.05*smoothstep(3.2,4.4,p.y)+0.04*smoothstep(0.9,1.3,abs(p.x));
  body-=shag*(noise3(p*vec3(9.0,2.5,9.0))-0.25);
  // a small ape head with a muzzle
  vec3 u=rotX(p-vec3(0.0,jHipY,0.0),-b.hunch)+vec3(0.0,jHipY,0.0);
  body=smin(body,sdEll(u-jHead-vec3(0.0,-0.12,0.2),vec3(0.18,0.14,0.16)),0.05);
  return vec2(body,FUR);
}
vec2 jawT(vec3 p){
  B b=formB(6); vec2 d=vec2(humanoid(p,b),MUSCLE);
  vec3 u=rotX(p-vec3(0.0,jHipY,0.0),-b.hunch)+vec3(0.0,jHipY,0.0);
  vec3 uq=vec3(abs(u.x),u.y,u.z);
  // the jaw: a hardened bone mask over the lower face, and claws
  float mask=smax(sdEll(u-jHead-vec3(0.0,-0.12,0.14),vec3(0.3,0.26,0.3)),-(u.z-jHead.z-0.02),0.03);
  mask=smax(mask,-sdBox(u-jHead-vec3(0.0,-0.2,0.35),vec3(0.2,0.012,0.2)),0.005);            // the bite line
  for(int i=0;i<3;i++){float o=(float(i)-1.0)*0.06;
    vec3 base=jHandL+vec3(o,-0.12,0.06);
    mask=min(mask,sdCone(uq,base,base+vec3(o*0.5,-0.2,0.18),0.04,0.008));}
  float tuft=sdEll(u-jHead-vec3(0.0,0.2,-0.08),vec3(0.26,0.18,0.28))+0.03*noise3(u*20.0);
  return U(U(d,vec2(mask,BONE)),vec2(tuft,BLOND));
}
vec2 cartT(vec3 p){
  vec3 q=vec3(abs(p.x),p.y,p.z);
  float d=sdCap(p,vec3(0.0,2.15,-1.25),vec3(0.0,2.4,1.0),0.6);
  d=smin(d,sdEll(p-vec3(0.0,2.35,0.8),vec3(0.66,0.62,0.6)),0.2);                          // chest
  d=smin(d,sdEll(p-vec3(0.0,2.2,-1.25),vec3(0.62,0.56,0.66)),0.2);                        // haunch
  for(int i=0;i<2;i++){float z=i==0?0.95:-1.25; float k=i==0?1.0:-1.0;
    d=smin(d,sdCone(q,vec3(0.42,2.05,z),vec3(0.5,1.1,z+0.15*k),0.26,0.17),0.12);
    d=smin(d,sdEll(q-vec3(0.5,1.1,z+0.15*k),vec3(0.13,0.12,0.13)),0.05);
    d=smin(d,sdCone(q,vec3(0.5,1.1,z+0.15*k),vec3(0.53,0.12,z+0.02),0.15,0.11),0.07);
    d=smin(d,sdEll(q-vec3(0.53,0.07,z+0.14),vec3(0.14,0.08,0.24)),0.05);}
  d=smin(d,sdCap(p,vec3(0.0,2.65,1.2),vec3(0.0,2.95,1.72),0.25),0.12);                    // neck
  d=smin(d,sdEll(p-vec3(0.0,3.05,1.95),vec3(0.28,0.3,0.34)),0.08);                        // head
  d=smin(d,sdEll(p-vec3(0.0,2.9,2.18),vec3(0.2,0.14,0.2)),0.05);                          // jaw
  vec2 body=vec2(d,SKIN);
  // a mane of dark hair along the neck and back
  float mane=sdCap(p,vec3(0.0,3.2,1.9),vec3(0.0,2.9,0.9),0.2)+0.04*noise3(p*vec3(20.0,3.0,20.0));
  mane=smin(mane,sdEll(p-vec3(0.0,3.25,1.95),vec3(0.3,0.16,0.32)),0.05);
  // the harness and its gun
  float iron=sdBox(p-vec3(0.0,3.02,-0.2),vec3(0.5,0.26,0.78))-0.03;
  iron=min(iron,sdBox(p-vec3(0.0,2.72,-0.2),vec3(0.66,0.04,0.12)));
  iron=min(iron,sdCap(p,vec3(-0.28,3.36,-0.55),vec3(-0.28,3.36,0.95),0.06));
  iron=min(iron,sdCap(p,vec3(0.28,3.36,-0.55),vec3(0.28,3.36,0.95),0.06));
  return U(U(body,vec2(mane,HAIR)),vec2(iron,IRON));
}
vec2 hammerT(vec3 p){
  B b=formB(7); vec2 d=vec2(humanoid(p,b),SKIN);
  vec3 u=rotX(p-vec3(0.0,jHipY,0.0),-b.hunch)+vec3(0.0,jHipY,0.0);
  vec3 uq=vec3(abs(u.x),u.y,u.z);
  // hardened plating: a tall hooded head, shoulders, bracers
  float pl=smax(sdEll(u-jHead-vec3(0.0,0.2,-0.08),vec3(0.28,0.5,0.34)),-(sdEll(u-jHead-vec3(0.0,-0.08,0.24),vec3(0.2,0.24,0.18))),0.03);
  pl=min(pl,smax(sdEll(uq-vec3(b.sw+0.02,jShY+0.02,0.0),vec3(0.3,0.26,0.3)),-(uq.y-jShY+0.1),0.04));
  // the war hammer, held upright in the right hand, forged from hardened flesh
  vec3 h=jHandR+vec3(0.0,0.1,0.02);
  float ham=sdCap(u,h+vec3(0.0,-2.1,0.0),h+vec3(0.0,2.5,0.0),0.055);
  ham=min(ham,sdBox(u-h-vec3(0.0,2.6,0.0),vec3(0.44,0.26,0.26))-0.03);
  ham=min(ham,sdCone(u,h+vec3(0.0,2.85,0.0),h+vec3(0.0,3.25,0.0),0.12,0.0));
  return U(U(d,vec2(pl,PLATE)),vec2(ham,CRYSTAL));
}
vec2 foundingT(vec3 p){ return vec2(bones(p,formB(0)),BONE); }

vec2 map(vec3 p){
  if(uForm==0) return foundingT(p);
  if(uForm==1) return attackT(p);
  if(uForm==2) return colossalT(p);
  if(uForm==3) return armoredT(p);
  if(uForm==4) return femaleT(p);
  if(uForm==5) return beastT(p);
  if(uForm==6) return jawT(p);
  if(uForm==7) return cartT(p);
  return hammerT(p);
}
float mapD(vec3 p){return map(p).x;}
vec3 nrm(vec3 p){vec2 k=vec2(1.0,-1.0);float e=0.003;
  return normalize(k.xyy*mapD(p+k.xyy*e)+k.yyx*mapD(p+k.yyx*e)+k.yxy*mapD(p+k.yxy*e)+k.xxx*mapD(p+k.xxx*e));}
float softShadow(vec3 ro,vec3 rd){float res=1.0;float t=0.04;
  for(int i=0;i<26;i++){float h=mapD(ro+rd*t);res=min(res,9.0*h/t);t+=clamp(h,0.05,0.4);if(res<0.02||t>6.0)break;}
  return clamp(res,0.0,1.0);}

// surface relief per material, as a height field sampled for bump normals
float relief(vec3 p,float m){
  if(m==MUSCLE) return noise3(p*vec3(70.0,6.0,70.0))*0.7+noise3(p*9.0)*0.3;   // fibre
  if(m==FUR||m==HAIR||m==BLOND) return noise3(p*vec3(50.0,5.0,50.0));          // strands
  if(m==PLATE) return 1.0-smoothstep(0.0,0.018,abs(fbm3(p*7.0)-0.5));           // hairline cracks in the hardening
  if(m==SKIN) return noise3(p*28.0)*0.6+noise3(p*6.0)*0.4;                       // pores, folds
  return noise3(p*20.0);
}
vec3 bump(vec3 p,vec3 n,float m,float s){
  float e=0.004; float h0=relief(p,m);
  vec3 g=vec3(relief(p+vec3(e,0,0),m)-h0,relief(p+vec3(0,e,0),m)-h0,relief(p+vec3(0,0,e),m)-h0)/e;
  return normalize(n-s*(g-n*dot(g,n)));
}

// ray/box: the bodies live in x[-1.9,1.9] y[-0.1,7.2] z[-1.9,2.6]
vec2 box(vec3 ro,vec3 rd){vec3 lo=vec3(-1.9,-0.1,-1.9),hi=vec3(1.9,7.2,2.6);vec3 t0=(lo-ro)/rd,t1=(hi-ro)/rd;
  vec3 a=min(t0,t1),b=max(t0,t1);return vec2(max(max(a.x,a.y),a.z),min(min(b.x,b.y),b.z));}

void main(){
  vec2 uv=(gl_FragCoord.xy/uRes)*2.0-1.0;
  float aspect=uRes.x/uRes.y;
  vec3 ro=vec3(0.0,3.45,15.5);
  vec3 rd=normalize(vec3(uv.x*aspect*0.235,uv.y*0.235,-1.0));
  float c=cos(uAngle),s=sin(uAngle); mat2 R=mat2(c,-s,s,c);
  ro.xz=R*ro.xz; rd.xz=R*rd.xz;
  vec2 bx=box(ro,rd);
  if(bx.x>bx.y||bx.y<0.0){outColor=vec4(0.0);return;}

  if(uMode==1){
    // x-ray: the body as faint density, the bones as bright film
    float body=0.0, bone=0.0; float st=0.025;
    B bb=formB(uForm==0?0:uForm==7?7:(uForm==8?7:uForm));
    for(int i=0;i<260;i++){float t=bx.x+float(i)*st; if(t>bx.y)break; vec3 p=ro+rd*t;
      float db=mapD(p); body+=exp(-abs(db)*26.0)*st;
      if(uForm!=7){ bone+=exp(-max(bones(p,bb),0.0)*60.0)*st; } }
    vec3 col=vec3(0.9,0.88,0.8)*(body*0.9+bone*3.4);
    float a=clamp(body*0.9+bone*3.4,0.0,1.0);
    outColor=vec4(col,a); return;
  }

  float t=max(bx.x,0.0); bool hit=false; vec3 p; vec2 h;
  for(int i=0;i<200;i++){p=ro+rd*t;h=map(p);if(h.x<0.0015){hit=true;break;}t+=h.x*0.8;if(t>bx.y)break;}
  if(!hit){outColor=vec4(0.0);return;}
  float m=h.y;
  vec3 n0=nrm(p);
  float bs=m==MUSCLE?0.0035:m==FUR?0.006:m==PLATE?0.0015:m==SKIN?0.002:0.0015;
  vec3 n=bump(p,n0,m,bs);
  vec3 V=-rd;
  // lights fixed to the camera: warm key front-left-above, hard rim behind, cool sky
  vec3 K=normalize(vec3(-0.85,0.5,0.1)); K.xz=R*K.xz;
  vec3 Rm=normalize(vec3(0.75,0.3,-0.6)); Rm.xz=R*Rm.xz;
  vec3 F=normalize(vec3(0.2,0.2,1.0)); F.xz=R*F.xz;
  float sh=softShadow(p+n0*0.01,K);
  float ao=0.0; for(int k=1;k<=5;k++){float hh=0.04*float(k);ao+=(hh-mapD(p+n0*hh))/hh;} ao=clamp(1.0-ao*0.16,0.2,1.0);

  vec3 alb; float spec=0.0, rough=24.0, sss=0.0;
  float v=noise3(p*3.0);
  if(m==SKIN){alb=mix(vec3(0.46,0.36,0.3),vec3(0.58,0.46,0.38),v)*(0.85+0.3*noise3(p*14.0)); spec=0.08; rough=12.0; sss=0.5;}
  else if(m==MUSCLE){float f=noise3(p*vec3(70.0,6.0,70.0)); alb=mix(vec3(0.24,0.06,0.05),vec3(0.52,0.18,0.14),0.3+0.7*f);
    alb=mix(alb,vec3(0.72,0.62,0.52),0.5*smoothstep(0.62,0.8,fbm3(p*vec3(6.0,2.0,6.0)))); spec=0.45; rough=60.0; sss=0.9;}
  else if(m==PLATE){alb=mix(vec3(0.76,0.73,0.66),vec3(0.58,0.55,0.5),v); alb*=1.0-0.6*relief(p,PLATE); spec=0.45; rough=40.0;}
  else if(m==CRYSTAL){alb=vec3(0.74,0.84,0.92); spec=1.0; rough=90.0;}
  else if(m==HAIR){alb=vec3(0.1,0.08,0.07)*(0.8+0.4*noise3(p*vec3(50.0,5.0,50.0))); spec=0.25; rough=30.0;}
  else if(m==BLOND){alb=vec3(0.66,0.54,0.33)*(0.75+0.4*noise3(p*vec3(50.0,5.0,50.0))); spec=0.2; rough=30.0;}
  else if(m==FUR){alb=mix(vec3(0.24,0.17,0.12),vec3(0.42,0.31,0.22),noise3(p*vec3(50.0,5.0,50.0))); spec=0.05;}
  else if(m==BONE){alb=vec3(0.82,0.78,0.68)*(0.85+0.2*v); spec=0.2; rough=20.0;}
  else {alb=vec3(0.26,0.25,0.24); spec=0.6; rough=50.0;}

  // the Attack Titan's cheek lines and green eyes; the Colossal's and Jaw's eyes glint
  vec3 emit=vec3(0.0);
  if(uForm==1||uForm==2||uForm==6){
    B b=formB(uForm==6?6:uForm); vec3 u=rotX(p-vec3(0.0,jHipY,0.0),-b.hunch)+vec3(0.0,jHipY,0.0);
    vec3 e=vec3(abs(u.x),u.y,u.z)-jHead-vec3(b.hr*0.34,b.hr*0.02,b.hr*0.78);
    float eye=1.0-smoothstep(0.0,0.05,length(e));
    emit+=(uForm==1?vec3(0.35,0.9,0.55):vec3(1.0,0.9,0.7))*eye*1.4;
    if(uForm==1){ vec3 c2=u-jHead; float line=smoothstep(0.012,0.0,abs(abs(c2.x)-0.16-c2.y*0.15))*step(-0.3,c2.y)*step(c2.y,-0.06)*step(0.12,c2.z); alb*=1.0-0.6*line; }
  }

  float diff=max(dot(n,K),0.0);
  float wrap=max(dot(n,K)*0.5+0.5,0.0);
  vec3 Hh=normalize(K+V);
  float sp=pow(max(dot(n,Hh),0.0),rough)*spec;
  float fres=pow(1.0-max(dot(n,V),0.0),4.0);
  float rim=pow(1.0-max(dot(n,V),0.0),2.2)*max(dot(n,Rm)*0.6+0.4,0.0);
  vec3 sky=vec3(0.3,0.33,0.38)*(0.4+0.6*n.y);
  float fill=max(dot(n,F),0.0);
  vec3 lit=alb*(vec3(1.1,0.95,0.78)*mix(diff,wrap*0.6,sss*0.3)*1.6*sh+sky*0.28+vec3(0.5,0.52,0.56)*fill*0.14)*ao;
  lit+=vec3(1.0,0.92,0.78)*sp*sh*1.6;
  lit+=vec3(1.0,0.86,0.66)*rim*1.1*ao;
  if(m==CRYSTAL) lit+=vec3(0.8,0.9,1.0)*fres*0.9+vec3(0.9,0.95,1.0)*pow(max(dot(n,Hh),0.0),200.0)*1.5;
  float trans=pow(clamp(dot(V,-normalize(Rm+n*0.3)),0.0,1.0),3.0)*sss;
  lit+=vec3(0.9,0.2,0.1)*trans*0.6*ao;
  lit+=emit;
  // archive grade: filmic shoulder, a little desaturation, warm paper blacks
  lit=lit/(1.0+lit*0.55); lit=pow(lit,vec3(0.95));
  float l=dot(lit,vec3(0.299,0.587,0.114)); lit=mix(vec3(l)*vec3(1.05,0.98,0.86),lit,0.6);
  lit=smoothstep(0.0,1.0,lit*1.05);
  outColor=vec4(lit,1.0);
}`;
const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;

const gl = document.getElementById("c").getContext("webgl2", { preserveDrawingBuffer: true, premultipliedAlpha: false, alpha: true, antialias: false });
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, "p");
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = (n) => gl.getUniformLocation(prog, n);

// the capture script renders at 1.5x-2x and downsamples
window.frame = (form, angle, w, h, mode = 0) => {
  const c = gl.canvas; c.width = w; c.height = h;
  gl.viewport(0, 0, w, h);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform2f(U("uRes"), w, h);
  gl.uniform1f(U("uAngle"), angle);
  gl.uniform1i(U("uForm"), form);
  gl.uniform1i(U("uMode"), mode);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  return c.toDataURL("image/png");
};
window.ready = true;
</script>
