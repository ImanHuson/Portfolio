<!doctype html>
<!--
  Offline turntable renderer for the Nine Titans silhouettes.
  Opened by scripts/titans/render.mjs in headless Chromium; not part of the site.
  One raymarched signed-distance body per Titan, modelled on its silhouette in
  the show (not a copy of any design): proportions, posture and one or two
  signature shapes each. Lit from behind, like the opening's Colossal.
-->
<meta charset="utf-8" />
<style>html,body{margin:0;background:transparent}canvas{display:block}</style>
<canvas id="c" width="300" height="600"></canvas>
<script>
const FS = `#version 300 es
precision highp float;
uniform vec2 uRes;
uniform float uAngle;
uniform int uForm;
out vec4 outColor;

float hash3(vec3 p){p=fract(p*0.3183099+0.1);p*=17.0;return fract(p.x*p.y*p.z*(p.x+p.y+p.z));}
float noise3(vec3 x){vec3 i=floor(x);vec3 f=fract(x);f=f*f*(3.0-2.0*f);
 return mix(mix(mix(hash3(i),hash3(i+vec3(1,0,0)),f.x),mix(hash3(i+vec3(0,1,0)),hash3(i+vec3(1,1,0)),f.x),f.y),
            mix(mix(hash3(i+vec3(0,0,1)),hash3(i+vec3(1,0,1)),f.x),mix(hash3(i+vec3(0,1,1)),hash3(i+vec3(1,1,1)),f.x),f.y),f.z);}
float smin(float a,float b,float k){float h=clamp(0.5+0.5*(b-a)/k,0.0,1.0);return mix(b,a,h)-k*h*(1.0-h);}
float smax(float a,float b,float k){return -smin(-a,-b,k);}
float sdCap(vec3 p,vec3 a,vec3 b,float r){vec3 pa=p-a,ba=b-a;float h=clamp(dot(pa,ba)/dot(ba,ba),0.0,1.0);return length(pa-ba*h)-r;}
float sdEll(vec3 p,vec3 r){float k0=length(p/r);float k1=length(p/(r*r));return k0*(k0-1.0)/k1;}
float sdBox(vec3 p,vec3 b){vec3 q=abs(p)-b;return length(max(q,0.0))+min(max(q.x,max(q.y,q.z)),0.0);}
vec3 rotX(vec3 p,float a){float c=cos(a),s=sin(a);return vec3(p.x,c*p.y-s*p.z,s*p.y+c*p.z);}

// A parameterised humanoid. sw/hw shoulder and hip half-widths, lr limb radius,
// leg hip height, tor torso length, hr head radius, arm reach (hand height),
// hunch forward lean of the upper body (radians).
struct B { float sw; float hw; float lr; float leg; float tor; float hr; float hand; float hunch; float bulk; };

float humanoid(vec3 p, B b, out vec3 headC) {
  vec3 q=vec3(abs(p.x),p.y,p.z);
  float hipY=b.leg;
  // legs (not hunched)
  vec3 hip=vec3(b.hw,hipY,0.0), knee=vec3(b.hw*1.08,hipY*0.52,0.1), ank=vec3(b.hw*1.12,0.2,-0.02);
  float d=sdCap(q,hip,knee,b.lr*1.25);
  d=smin(d,sdCap(q,knee,ank,b.lr*0.9),0.1);
  d=smin(d,sdEll(q-vec3(b.hw*1.12,0.1,0.14),vec3(b.lr*0.95,0.1,b.lr*1.9)),0.06);
  d=smin(d,sdEll(p-vec3(0.0,hipY+0.05,0.0),vec3(b.hw*1.55,0.3,0.32*b.bulk)),0.12);
  // upper body, hunched around the hips
  vec3 u=rotX(p-vec3(0.0,hipY,0.0),-b.hunch)+vec3(0.0,hipY,0.0);
  vec3 uq=vec3(abs(u.x),u.y,u.z);
  float shY=hipY+b.tor;
  float up=sdCap(u,vec3(0.0,hipY+0.15,0.0),vec3(0.0,shY-0.45,0.02),0.3*b.bulk);
  up=smin(up,sdEll(u-vec3(0.0,shY-0.25,0.0),vec3(b.sw*0.82,0.5,0.38*b.bulk)),0.2);
  up=smin(up,sdEll(uq-vec3(b.sw,shY-0.02,0.0),vec3(0.26*b.bulk,0.24*b.bulk,0.26*b.bulk)),0.12);
  vec3 sh=vec3(b.sw+0.08,shY-0.08,0.0);
  float armLen=shY-b.hand;
  vec3 el=vec3(b.sw+0.2,shY-armLen*0.5,0.1);
  vec3 hd=vec3(b.sw+0.25,b.hand,0.26);
  up=smin(up,sdCap(uq,sh,el,b.lr*1.05),0.08);
  up=smin(up,sdCap(uq,el,hd,b.lr*0.82),0.1);
  up=smin(up,sdEll(uq-hd-vec3(0.0,-0.18,0.02),vec3(0.1,0.21,0.13)*(0.8+0.3*b.bulk)),0.05);
  up=smin(up,sdCap(u,vec3(0.0,shY-0.1,0.0),vec3(0.0,shY+0.3,0.06),0.17*b.bulk),0.1);
  headC=vec3(0.0,shY+0.3+b.hr*0.95,0.05);
  up=smin(up,sdEll(u-headC,vec3(b.hr*0.88,b.hr,b.hr*0.98)),0.08);
  up=smin(up,sdEll(u-headC-vec3(0.0,-b.hr*0.55,b.hr*0.35),vec3(b.hr*0.7,b.hr*0.55,b.hr*0.7)),0.07); // jaw
  d=smin(d,up,0.14);
  d+=0.03*(noise3(p*4.5)-0.5)+0.012*(noise3(p*vec3(26.0,4.0,26.0))-0.5);
  return d;
}

// The Colossal, as in the opening scene (gaunt, lipless, heavy brow)
float colossal(vec3 p){
  B b=B(0.72,0.3,0.2,3.0,1.8,0.34,2.4,0.04,1.0);
  vec3 hc; float d=humanoid(p,b,hc);
  vec3 q=vec3(abs(p.x),p.y,p.z);
  d=smin(d,sdEll(p-hc-vec3(0.0,0.08,0.2),vec3(0.3,0.08,0.14)),0.06);           // brow
  d=smax(d,-sdEll(q-hc-vec3(0.11,-0.02,0.3),vec3(0.08,0.055,0.1)),0.03);        // sockets
  d+=0.012*sin(p.y*30.0)*smoothstep(0.3,0.5,q.x)*(1.0-smoothstep(0.56,0.64,q.x))*step(3.8,p.y)*step(p.y,4.7);
  return d;
}
float attack(vec3 p){
  B b=B(0.7,0.3,0.19,3.05,1.65,0.3,2.45,0.06,0.95);
  vec3 hc; float d=humanoid(p,b,hc);
  // long hair: a mass hanging behind and around the head to the shoulders
  float hair=sdEll(p-hc-vec3(0.0,-0.2,-0.12),vec3(0.38,0.5,0.34));
  hair+=0.03*noise3(p*vec3(3.0,14.0,3.0));
  d=smin(d,hair,0.04);
  vec3 q=vec3(abs(p.x),p.y,p.z);
  d=smax(d,-sdEll(q-hc-vec3(0.1,0.02,0.26),vec3(0.07,0.04,0.08)),0.03);
  return d;
}
float armored(vec3 p){
  B b=B(0.95,0.36,0.26,2.85,1.75,0.33,2.35,0.03,1.35);
  vec3 hc; float d=humanoid(p,b,hc);
  // plates: segmented ridges across the torso and limbs, a helmet crest
  float torso=step(3.0,p.y)*step(p.y,4.9)*step(abs(p.x),0.75);
  float bands=abs(fract(p.y*1.7)-0.5);
  d-=0.045*smoothstep(0.38,0.5,bands)*torso;
  vec3 q=vec3(abs(p.x),p.y,p.z);
  d=smin(d,sdEll(q-vec3(1.02,4.62,0.0),vec3(0.38,0.3,0.36)),0.05);             // pauldrons
  d=smin(d,sdEll(p-hc-vec3(0.0,0.1,-0.02),vec3(0.36,0.3,0.38)),0.04);          // helmet
  return d;
}
float female(vec3 p){
  B b=B(0.58,0.34,0.16,3.25,1.6,0.27,2.55,0.02,0.8);
  vec3 hc; float d=humanoid(p,b,hc);
  // narrow waist, short hair, a pinned-up tuft
  d=smin(d,sdEll(p-hc-vec3(0.0,0.07,-0.04),vec3(0.31,0.26,0.32)),0.03);
  d=smin(d,sdEll(p-hc-vec3(0.0,0.1,-0.3),vec3(0.12,0.14,0.12)),0.05);
  return d;
}
float beast(vec3 p){
  B b=B(1.0,0.32,0.23,2.3,1.85,0.26,0.75,0.32,1.25);
  vec3 hc; float d=humanoid(p,b,hc);
  d-=0.07*(noise3(p*6.0)-0.3)*smoothstep(1.0,2.5,p.y);   // fur
  return d;
}
float jaw(vec3 p){
  B b=B(0.62,0.3,0.17,1.9,1.6,0.3,0.25,0.75,0.95);
  vec3 hc; float d=humanoid(p,b,hc);
  // the jaw: a heavy lower face; claws at the hands
  vec3 u=rotX(p-vec3(0.0,1.9,0.0),-0.75)+vec3(0.0,1.9,0.0);
  d=smin(d,sdEll(u-hc-vec3(0.0,-0.28,0.22),vec3(0.3,0.2,0.3)),0.05);
  vec3 uq=vec3(abs(u.x),u.y,u.z);
  for(int i=0;i<3;i++){float o=float(i)*0.07-0.07;
    d=min(d,sdCap(uq,vec3(0.87+o,0.1,1.05),vec3(0.9+o*1.3,-0.2,1.3),0.03));}
  return d;
}
float cart(vec3 p){
  // four-legged, long-bodied, low, a harness box on its back
  vec3 q=vec3(abs(p.x),p.y,p.z);
  float d=sdCap(p,vec3(0.0,2.1,-1.3),vec3(0.0,2.35,1.1),0.62);
  d=smin(d,sdEll(p-vec3(0.0,2.2,-1.25),vec3(0.62,0.55,0.7)),0.2);
  for(int i=0;i<2;i++){ float z=i==0?0.95:-1.25;
    d=smin(d,sdCap(q,vec3(0.42,2.0,z),vec3(0.5,1.0,z+0.18),0.2),0.12);
    d=smin(d,sdCap(q,vec3(0.5,1.0,z+0.18),vec3(0.52,0.1,z+0.05),0.15),0.08);
    d=smin(d,sdEll(q-vec3(0.52,0.07,z+0.18),vec3(0.16,0.08,0.24)),0.05); }
  d=smin(d,sdCap(p,vec3(0.0,2.6,1.25),vec3(0.0,2.95,1.75),0.24),0.12);        // neck
  d=smin(d,sdEll(p-vec3(0.0,3.05,1.95),vec3(0.3,0.3,0.34)),0.08);             // head
  d=smin(d,sdEll(q-vec3(0.14,3.18,2.06),vec3(0.1,0.13,0.1)),0.04);
  float box=sdBox(p-vec3(0.0,3.05,-0.2),vec3(0.46,0.28,0.75))-0.03;           // the harness
  d=min(d,box);
  d=min(d,sdCap(p,vec3(-0.3,3.35,-0.6),vec3(-0.3,3.35,0.9),0.06));             // gun barrel
  return d;
}
float hammer(vec3 p){
  B b=B(0.62,0.3,0.16,3.25,1.65,0.26,2.5,0.02,0.85);
  vec3 hc; float d=humanoid(p,b,hc);
  d=smin(d,sdEll(p-hc-vec3(0.0,0.22,-0.1),vec3(0.24,0.5,0.3)),0.05);          // the tall, hooded head
  // the war hammer, held upright in the right hand
  vec3 h=vec3(-0.9,2.5,0.25);
  d=min(d,sdCap(p,h+vec3(0.0,-2.2,0.0),h+vec3(0.0,3.9,0.0),0.055));
  d=min(d,sdBox(p-h-vec3(0.0,3.95,0.0),vec3(0.42,0.24,0.24))-0.03);
  return d;
}
float founding(vec3 p){
  // the Coordinate as bones: spine, ribs, skull, long limb bones
  vec3 q=vec3(abs(p.x),p.y,p.z);
  float d=sdCap(p,vec3(0.0,3.0,-0.2),vec3(0.0,5.1,-0.12),0.06+0.015*sin(p.y*60.0));
  for(int i=0;i<9;i++){float fi=float(i);float ax=0.5-abs(fi-3.5)*0.028;float az=0.34-abs(fi-3.5)*0.012;
    float y=4.62-fi*0.12-0.16*(p.z/az);vec2 e=vec2(p.x/ax,(p.z+0.02)/az);float r=(length(e)-1.0)*min(ax,az);
    float rib=length(vec2(r,(p.y-y)*1.3))-0.028; rib=max(rib,0.1-length(vec2(p.x*3.0,max(p.z-0.2,0.0)))); d=min(d,rib);}
  d=min(d,sdCap(p,vec3(0.0,4.64,0.34),vec3(0.0,4.0,0.35),0.04));
  d=min(d,sdCap(q,vec3(0.05,4.8,0.24),vec3(0.62,4.84,0.02),0.04));
  float skull=sdEll(p-vec3(0.0,5.55,0.0),vec3(0.3,0.34,0.34));
  skull=smin(skull,sdEll(p-vec3(0.0,5.25,0.12),vec3(0.22,0.16,0.24)),0.06);
  skull=smax(skull,-sdEll(q-vec3(0.11,5.5,0.3),vec3(0.08,0.07,0.1)),0.02);
  d=min(d,skull);
  d=min(d,smax(abs(sdEll(p-vec3(0.0,3.05,0.0),vec3(0.45,0.26,0.28)))-0.04,p.y-3.15,0.02));
  d=min(d,sdCap(q,vec3(0.72,4.62,0.0),vec3(0.95,3.6,0.08),0.07));
  d=min(d,sdCap(q,vec3(0.95,3.6,0.08),vec3(1.0,2.55,0.24),0.05));
  d=min(d,sdCap(q,vec3(0.3,3.0,0.0),vec3(0.33,1.7,0.08),0.08));
  d=min(d,sdCap(q,vec3(0.33,1.7,0.08),vec3(0.35,0.2,-0.02),0.06));
  d=min(d,sdEll(q-vec3(0.36,0.08,0.14),vec3(0.12,0.07,0.26)));
  return d;
}

float map(vec3 p){
  if(uForm==0) return founding(p);
  if(uForm==1) return attack(p);
  if(uForm==2) return colossal(p);
  if(uForm==3) return armored(p);
  if(uForm==4) return female(p);
  if(uForm==5) return beast(p);
  if(uForm==6) return jaw(p);
  if(uForm==7) return cart(p);
  return hammer(p);
}
vec3 nrm(vec3 p){vec2 k=vec2(1.0,-1.0);float e=0.004;
  return normalize(k.xyy*map(p+k.xyy*e)+k.yyx*map(p+k.yyx*e)+k.yxy*map(p+k.yxy*e)+k.xxx*map(p+k.xxx*e));}

void main(){
  vec2 uv=(gl_FragCoord.xy/uRes)*2.0-1.0;
  float aspect=uRes.x/uRes.y;
  vec3 ro=vec3(0.0,3.45,15.5);
  vec3 rd=normalize(vec3(uv.x*aspect*0.235,uv.y*0.235,-1.0));
  // turn the body, not the camera
  float c=cos(uAngle),s=sin(uAngle);
  mat2 R=mat2(c,-s,s,c);
  ro.xz=R*ro.xz; rd.xz=R*rd.xz;
  float t=10.0; bool hit=false; vec3 p;
  for(int i=0;i<140;i++){p=ro+rd*t;float d=map(p);if(d<0.002){hit=true;break;}t+=d*0.85;if(t>22.0)break;}
  if(!hit){outColor=vec4(0.0);return;}
  vec3 n=nrm(p);
  vec3 L=normalize(vec3(-0.5,0.55,-0.8)); L.xz=R*L.xz;   // the sun behind the body
  vec3 V=-rd;
  float bone=(uForm==0)?1.0:0.0;
  float plate=(uForm==3)?(step(3.0,p.y)*step(p.y,5.4)*(1.0-smoothstep(0.35,0.5,abs(fract(p.y*1.7)-0.5))*0.35)*step(0.02,1.0)):0.0;
  vec3 flesh=mix(vec3(0.4,0.2,0.16),vec3(0.6,0.42,0.34),noise3(p*4.0));
  vec3 col=mix(flesh,vec3(0.78,0.74,0.64),max(bone,plate*0.8));
  if(uForm==1 && p.y>5.05 && p.z<0.12) col=vec3(0.13,0.1,0.08);                            // the Attack Titan's long dark hair
  if(uForm==7 && p.y>2.75 && abs(p.x)<0.5 && p.z<0.6 && p.z>-1.0) col=vec3(0.3,0.28,0.25);   // harness iron
  if(uForm==8 && (abs(p.x+0.9)<0.1 || p.y>6.1)) col=vec3(0.75,0.72,0.64);                   // hardened hammer
  float ao=0.0; for(int k=1;k<=4;k++){float h=0.05*float(k);ao+=(h-map(p+n*h))/h;} ao=clamp(1.0-ao*0.2,0.3,1.0);
  float diff=max(dot(n,L),0.0);
  float rim=pow(1.0-max(dot(n,V),0.0),2.6)*(0.4+1.3*max(dot(-V,L),0.0));
  float fill=0.16+0.14*n.y;
  vec3 F=normalize(vec3(0.6,0.35,0.9)); F.xz=R*F.xz;
  float front=max(dot(n,F),0.0);
  vec3 lit=col*(vec3(1.05,0.92,0.76)*diff*1.1+vec3(0.5,0.52,0.55)*fill+vec3(0.62,0.6,0.58)*front*0.75)*ao+vec3(1.0,0.9,0.72)*rim*1.0;
  float trans=pow(clamp(dot(V,-normalize(L+n*0.35)),0.0,1.0),4.0)*(1.0-bone);
  lit+=vec3(0.9,0.22,0.1)*trans*0.5;
  // archive grade: a warm, slightly faded print
  float l=dot(lit,vec3(0.299,0.587,0.114)); lit=mix(vec3(l),lit,0.8); lit=lit/(1.0+lit*0.3);
  outColor=vec4(lit,1.0);
}`;
const VS = `#version 300 es
in vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }`;

const gl = document.getElementById("c").getContext("webgl2", { preserveDrawingBuffer: true, premultipliedAlpha: false, alpha: true, antialias: false });
function sh(type, src) { const s = gl.createShader(type); gl.shaderSource(s, src); gl.compileShader(s); if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s)); return s; }
const prog = gl.createProgram();
gl.attachShader(prog, sh(gl.VERTEX_SHADER, VS));
gl.attachShader(prog, sh(gl.FRAGMENT_SHADER, FS));
gl.linkProgram(prog);
if (!gl.getProgramParameter(prog, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(prog));
gl.useProgram(prog);
const buf = gl.createBuffer();
gl.bindBuffer(gl.ARRAY_BUFFER, buf);
gl.bufferData(gl.ARRAY_BUFFER, new Float32Array([-1, -1, 3, -1, -1, 3]), gl.STATIC_DRAW);
const loc = gl.getAttribLocation(prog, "p");
gl.enableVertexAttribArray(loc);
gl.vertexAttribPointer(loc, 2, gl.FLOAT, false, 0, 0);
const U = (n) => gl.getUniformLocation(prog, n);

// 2x supersampling: render at double size, the capture script downsamples
window.frame = (form, angle, w, h) => {
  const c = gl.canvas; c.width = w; c.height = h;
  gl.viewport(0, 0, w, h);
  gl.clearColor(0, 0, 0, 0); gl.clear(gl.COLOR_BUFFER_BIT);
  gl.uniform2f(U("uRes"), w, h);
  gl.uniform1f(U("uAngle"), angle);
  gl.uniform1i(U("uForm"), form);
  gl.drawArrays(gl.TRIANGLES, 0, 3);
  return c.toDataURL("image/png");
};
window.ready = true;
</script>
