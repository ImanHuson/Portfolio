<!doctype html><meta charset="utf-8"><title>ph test</title>
<style>html,body{margin:0;height:100%;background:#000}canvas{display:block;width:100vw;height:100vh}</style>
<script type="module">
import { Renderer, Camera, Transform, Program, Mesh, Texture, Triangle, GLTFLoader } from 'ogl';
const HDRI = 'studio_small_09';
const renderer = new Renderer({ dpr: 1, antialias: true }); const gl = renderer.gl; document.body.appendChild(gl.canvas);
gl.clearColor(0,0,0,1);
const camera = new Camera(gl, { fov: 32, near: 0.01, far: 100 }); camera.position.set(0.55, 0.25, 1.45); camera.lookAt([0, 0.05, 0]);
renderer.setSize(innerWidth, innerHeight); camera.perspective({ aspect: innerWidth / innerHeight });
function tex(src, opts={}) { const t = new Texture(gl, opts); const img = new Image(); img.onload = () => (t.image = img); img.src = src; return t; }
const env = tex(`${HDRI}-env-rgbm.png`, { generateMipmaps: true, minFilter: gl.LINEAR_MIPMAP_LINEAR, premultiplyAlpha: false, unpackAlignment: 1 });
const irr = tex(`${HDRI}-diffuse-rgbm.png`, { generateMipmaps: false, premultiplyAlpha: false });
const bg = tex(`${HDRI}-bg.webp`, { generateMipmaps: false });
const ENV = /* glsl */`
const float PI = 3.14159265;
vec2 eq(vec3 d){ return vec2(atan(d.z, d.x) / (2.0*PI) + 0.5, acos(clamp(d.y,-1.0,1.0)) / PI); }
vec3 rgbm(vec4 c){ return c.rgb * c.a * 6.0; }
vec3 aces(vec3 x){ return clamp((x*(2.51*x+0.03))/(x*(2.43*x+0.59)+0.14),0.0,1.0); }`;
// Background: the tonemapped equirect, looked up by view direction.
const bgMesh = new Mesh(gl, { geometry: new Triangle(gl), program: new Program(gl, { vertex: `#version 300 es
in vec2 position; out vec2 vUv; void main(){ vUv = position*0.5+0.5; gl_Position = vec4(position,0.999,1.0); }`, fragment: `#version 300 es
precision highp float; uniform sampler2D tBg; uniform mat4 invVP; uniform vec3 uCam; in vec2 vUv; out vec4 o; ${ENV}
void main(){ vec4 p = invVP * vec4(vUv*2.0-1.0, 1.0, 1.0); vec3 d = normalize(p.xyz/p.w - uCam); o = vec4(texture(tBg, eq(d)).rgb*0.5, 1.0); }`, uniforms: { tBg: { value: bg }, invVP: { value: new Float32Array(16) }, uCam: { value: camera.position } }, depthWrite: false, depthTest: false }) });
const scene = new Transform();
const VERT = `#version 300 es
in vec3 position; in vec3 normal; in vec2 uv; uniform mat4 modelMatrix, viewMatrix, projectionMatrix; uniform mat3 normalMatrix;
out vec3 vPos; out vec3 vN; out vec2 vUv;
void main(){ vec4 wp = modelMatrix*vec4(position,1.0); vPos = wp.xyz; vN = normalize(mat3(modelMatrix)*normal); vUv = uv; gl_Position = projectionMatrix*viewMatrix*wp; }`;
const FRAG = `#version 300 es
precision highp float; ${ENV}
uniform sampler2D tBase, tMR, tNormal, tEnv, tIrr; uniform vec3 cameraPosition; uniform float uEnvLod, uExposure;
in vec3 vPos; in vec3 vN; in vec2 vUv; out vec4 o;
vec3 perturb(vec3 n){ vec3 dp1=dFdx(vPos), dp2=dFdy(vPos); vec2 du1=dFdx(vUv), du2=dFdy(vUv);
  vec3 t = normalize(dp1*du2.y - dp2*du1.y); vec3 b = normalize(cross(n,t)); vec3 m = texture(tNormal,vUv).xyz*2.0-1.0; return normalize(mat3(t,b,n)*m); }
void main(){
  vec3 base = pow(texture(tBase,vUv).rgb, vec3(2.2)); vec4 mr = texture(tMR,vUv); float rough = clamp(mr.g,0.04,1.0), metal = mr.b;
  vec3 n = perturb(normalize(vN)); vec3 v = normalize(cameraPosition - vPos); vec3 r = reflect(-v, n);
  float nv = clamp(dot(n,v),0.0,1.0); vec3 f0 = mix(vec3(0.04), base, metal);
  vec4 c0 = vec4(-1.0,-0.0275,-0.572,0.022), c1 = vec4(1.0,0.0425,1.04,-0.04); vec4 rr = rough*c0+c1;
  float a004 = min(rr.x*rr.x, exp2(-9.28*nv))*rr.x+rr.y; vec2 ab = vec2(-1.04,1.04)*a004+rr.zw;  // Karis env BRDF approx
  vec3 spec = rgbm(textureLod(tEnv, eq(r), rough*uEnvLod)) * (f0*ab.x+ab.y);
  vec3 diff = rgbm(texture(tIrr, eq(n))) * base * (1.0-metal);
  o = vec4(pow(aces((diff+spec)*uExposure), vec3(1.0/2.2)), 1.0);
}`;
const white = new Texture(gl, { image: new Uint8Array([255,255,255,255]), width:1, height:1 });
const flat = new Texture(gl, { image: new Uint8Array([128,128,255,255]), width:1, height:1 });
const gltf = await GLTFLoader.load(gl, 'antique_katana_01/antique_katana_01_1k.gltf');
const root = gltf.scene[0]; root.setParent(scene); root.rotation.set(0, 0.6, 1.25); root.position.set(0.05,0.0,0); 
root.traverse(node => { if (!node.program) return; const m = node.program.gltfMaterial || {};
  node.program = new Program(gl, { vertex: VERT, fragment: FRAG, uniforms: {
    tBase: { value: m.baseColorTexture?.texture || white }, tMR: { value: m.metallicRoughnessTexture?.texture || white },
    tNormal: { value: m.normalTexture?.texture || flat }, tEnv: { value: env }, tIrr: { value: irr },
    uEnvLod: { value: 9.0 }, uExposure: { value: 1.1 } } }); });
const vp = new Float32Array(16);
import('ogl').then(({ Mat4 }) => {
  function frame(t){ requestAnimationFrame(frame); root.rotation.y = 0.6 + t*0.0002;
    camera.updateMatrixWorld(); const m = new Mat4().multiply(camera.projectionMatrix, camera.viewMatrix).inverse();
    bgMesh.program.uniforms.invVP.value = m; renderer.render({ scene: bgMesh, camera, clear: true }); renderer.render({ scene, camera, clear: false }); }
  requestAnimationFrame(frame); window.__ready = true; });
</script>
